<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <path id="textPathTop" d="M 30,120 A 90,90 0 0,1 210,120" />
    <path id="textPathBottom" d="M 210,120 A 90,90 0 0,1 30,120" />
  </defs>

  <!-- Outer Double Circle -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="120" cy="120" r="105" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="120" cy="120" r="76" fill="none" stroke="currentColor" stroke-width="2.5"/>

  <!-- Text around circle -->
  <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="19" letter-spacing="4" fill="currentColor">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      DANGAR ISLAND
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="16" letter-spacing="5" fill="currentColor">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      DYARUBBIN
    </textPath>
  </text>

  <!-- Inner Graphics: Jumping Hawkesbury Mullet Fish & Wooden Ferry -->
  <!-- Leaping Fish -->
  <g transform="translate(120, 84) scale(0.65) translate(-120, -80)">
    <!-- Arching Body -->
    <path d="M 60,95 C 75,50 145,45 175,75 C 185,85 180,95 165,92 C 140,86 95,80 60,95 Z" fill="currentColor"/>
    <!-- Tail Fin -->
    <polygon points="58,95 40,78 46,96 38,114 58,97" fill="currentColor"/>
    <!-- Dorsal Fin -->
    <path d="M 115,54 C 130,42 145,48 150,56 C 138,58 126,58 115,54 Z" fill="currentColor"/>
    <!-- Pectoral Fin -->
    <polygon points="140,82 155,95 142,92" fill="currentColor"/>
    <!-- Eye & Gill -->
    <circle cx="165" cy="76" r="2.5" fill="#FFF"/>
    <path d="M 152,70 Q 155,80 148,88" stroke="#FFF" stroke-width="2" fill="none"/>
    <!-- Water Splashes -->
    <circle cx="184" cy="72" r="2" fill="currentColor"/>
    <circle cx="190" cy="80" r="1.5" fill="currentColor"/>
  </g>

  <!-- Small Wooden Ferry Boat below fish -->
  <g transform="translate(120, 134) scale(0.5) translate(-120, -110)">
    <!-- Hull -->
    <path d="M 70,115 L 170,115 C 180,115 170,132 120,132 C 70,132 60,115 70,115 Z" fill="currentColor"/>
    <!-- Cabin -->
    <rect x="85" y="92" width="70" height="23" rx="2" fill="currentColor"/>
    <!-- Windows cut out -->
    <rect x="92" y="97" width="10" height="11" rx="1" fill="#FFF"/>
    <rect x="106" y="97" width="10" height="11" rx="1" fill="#FFF"/>
    <rect x="120" y="97" width="10" height="11" rx="1" fill="#FFF"/>
    <rect x="134" y="97" width="10" height="11" rx="1" fill="#FFF"/>
    <rect x="148" y="97" width="4" height="11" rx="1" fill="#FFF"/>
    <!-- Roof and Mast -->
    <line x1="82" y1="92" x2="158" y2="92" stroke="currentColor" stroke-width="3"/>
    <line x1="120" y1="80" x2="120" y2="92" stroke="currentColor" stroke-width="2.5"/>
    <polygon points="120,80 132,84 120,88" fill="currentColor"/>
    <!-- Waves -->
    <path d="M 50,135 Q 85,128 120,135 T 190,135" fill="none" stroke="currentColor" stroke-width="2.5"/>
  </g>
</svg>
