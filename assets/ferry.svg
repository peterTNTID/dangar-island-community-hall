<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F4F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFDF7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#F4E8C1"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D85A38"/>
      <stop offset="100%" stop-color="#B83A1B"/>
    </linearGradient>
  </defs>

  <!-- Gentle River Waves Background -->
  <path d="M10 140 Q 60 132 110 140 T 210 140 T 310 140 T 390 140" fill="none" stroke="#A8DADC" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M0 148 Q 50 142 100 148 T 200 148 T 300 148 T 400 148" fill="none" stroke="#457B9D" stroke-width="4" stroke-linecap="round"/>

  <!-- Smoke / Steam Funnel Puff -->
  <circle cx="215" cy="22" r="5" fill="#E2E8F0" opacity="0.7"/>
  <circle cx="225" cy="15" r="7" fill="#E2E8F0" opacity="0.6"/>
  <circle cx="238" cy="8" r="9" fill="#E2E8F0" opacity="0.4"/>

  <!-- Funnel / Chimney -->
  <rect x="208" y="28" width="14" height="22" rx="2" fill="#D85A38" stroke="#1D3557" stroke-width="2.5"/>
  <rect x="206" y="28" width="18" height="5" rx="1" fill="#1D3557"/>

  <!-- Top Mast & Island Pennant Flag -->
  <line x1="160" y1="20" x2="160" y2="50" stroke="#1D3557" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="160,20 185,26 160,32" fill="#E76F51" stroke="#1D3557" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Upper Deck / Cabin Roof -->
  <path d="M110 50 L290 50 Q296 50 294 56 L288 58 L112 58 Q106 58 108 52 Z" fill="url(#roofGrad)" stroke="#1D3557" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cabin Body -->
  <path d="M115 58 L285 58 L278 102 L122 102 Z" fill="url(#cabinGrad)" stroke="#1D3557" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cabin Windows -->
  <g fill="#A8DADC" stroke="#1D3557" stroke-width="2">
    <!-- Wheelhouse window -->
    <rect x="126" y="65" width="22" height="22" rx="3"/>
    <rect x="156" y="65" width="20" height="22" rx="3"/>
    <rect x="184" y="65" width="20" height="22" rx="3"/>
    <rect x="212" y="65" width="20" height="22" rx="3"/>
    <rect x="240" y="65" width="20" height="22" rx="3"/>
    <!-- Window glints -->
    <line x1="130" y1="82" x2="142" y2="68" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="160" y1="82" x2="172" y2="68" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="188" y1="82" x2="200" y2="68" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="216" y1="82" x2="228" y2="68" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="244" y1="82" x2="256" y2="68" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Wooden Rubbing Strake / Trim -->
  <rect x="90" y="100" width="220" height="6" rx="2" fill="#E9C46A" stroke="#1D3557" stroke-width="2"/>

  <!-- Lower Hull (Timber Ferry Shape) -->
  <path d="M85 106 L315 106 Q335 106 310 136 Q280 144 200 144 Q120 144 90 136 Q65 106 85 106 Z" fill="url(#hullGrad)" stroke="#1D3557" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Hull Waterline Stripe -->
  <path d="M80 124 Q135 132 200 132 Q265 132 320 124" fill="none" stroke="#F4A261" stroke-width="3" opacity="0.9"/>

  <!-- Lifebuoy Ring on side -->
  <circle cx="200" cy="116" r="8" fill="#FFF" stroke="#1D3557" stroke-width="2"/>
  <circle cx="200" cy="116" r="4" fill="#2D6A4F" stroke="#1D3557" stroke-width="1.5"/>
  <path d="M194 116 L192 116 M206 116 L208 116 M200 110 L200 108 M200 122 L200 124" stroke="#E76F51" stroke-width="2"/>

  <!-- Ferry Name Plaque -->
  <rect x="130" y="112" width="46" height="8" rx="2" fill="#FAF0CA" stroke="#1D3557" stroke-width="1"/>
  <text x="153" y="118.5" font-family="'Patrick Hand', 'Comic Sans MS', cursive, sans-serif" font-size="6" font-weight="bold" fill="#1D3557" text-anchor="middle">DANGAR</text>

  <!-- Front Bow Wake / Splashes -->
  <path d="M60 146 Q75 138 88 144" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="68" cy="140" r="2" fill="#FFF"/>
  <circle cx="56" cy="144" r="1.5" fill="#FFF"/>
  <path d="M312 144 Q325 138 340 146" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="332" cy="140" r="2" fill="#FFF"/>
</svg>
